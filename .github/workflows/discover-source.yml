name: Discover prayer-time source

# Reconnaissance run: derislam.at rejects non-browser clients, so we probe it
# from a real Chromium here and inspect the result before writing the parser.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to probe
        default: https://www.derislam.at/gebetszeiten

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Probe source
        env:
          TARGET_URL: ${{ inputs.url || 'https://www.derislam.at/gebetszeiten' }}
        run: npm run discover

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery
          path: out/
          retention-days: 14
