name: Deploy to Pages

# public/ is served as-is - no build step, so what is in the repo is exactly
# what ships. Runs after a data refresh too, so the monthly commit reaches the
# live display without a manual deploy.
on:
  push:
    branches: [claude/azan-webapp-wien-deploy-pojkho]
    paths:
      - public/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A data refresh and a code push can land together; let the later one win
# rather than queueing two deploys of the same tree.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
